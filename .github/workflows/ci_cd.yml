name: Enterprise ETL CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Formatting & Type Checking
  # ----------------------------------------------------------------------------
  lint-and-validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Run Black Code Formatter Check
        run: |
          black --check --line-length 120 config extractors models notifications pipeline storage transformers warehouse tests || true

      - name: Run Flake8 Linter
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  # ----------------------------------------------------------------------------
  # Job 2: Comprehensive Pytest Test Suite
  # ----------------------------------------------------------------------------
  test-suite:
    name: Pytest Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-validate

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: enterprise_dw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Full Test Suite with Coverage
        env:
          DB_TYPE: sqlite
          DB_SQLITE_DB_PATH: ":memory:"
          STORAGE_MODE: local
        run: |
          pytest -v --tb=short --cov=. --cov-report=xml --cov-report=term

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build & Smoke Test
  # ----------------------------------------------------------------------------
  docker-smoke-test:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-etl-pipeline:latest
          load: true

      - name: Run Docker Smoke Test
        run: |
          docker run --rm enterprise-etl-pipeline:latest --source all --mode mock --no-sync-db
