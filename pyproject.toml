[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-etl-pipeline"
version = "1.0.0"
description = "Enterprise ETL Pipeline & Data Warehouse Synchronizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "tenacity>=8.3.0",
    "boto3>=1.34.0",
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
